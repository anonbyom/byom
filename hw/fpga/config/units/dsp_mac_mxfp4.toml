# BYOM's DSP48E2 PE (rtl/pe/dsp_mac.sv), MXFP4: E2M1 codes, E8M0 scales, FP32 accumulation.
sources = ["rtl/pe/dsp_mac.sv"]

[shape]
n_a = 2

[operands]
